{% extends "base.html" %}

{% block page_title %}Settings{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card border-0 rounded-4 shadow-sm p-4 bg-white">
            <div class="card-body">
                <div class="d-flex align-items-center mb-4">
                    <div class="bg-purple-subtle text-purple p-3 rounded-circle me-3">
                        <i class="fas fa-key fa-2x"></i>
                    </div>
                    <div>
                        <h4 class="fw-bold mb-0">Change Password</h4>
                        <p class="text-muted small mb-0">Update your administrator account login password.</p>
                    </div>
                </div>

                <form method="POST" action="{{ url_for('settings.index') }}">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Current Password *</label>
                        <input type="password" class="form-control rounded-3" name="current_password" placeholder="Enter current password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">New Password *</label>
                        <input type="password" class="form-control rounded-3" name="new_password" placeholder="Enter new password" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Confirm New Password *</label>
                        <input type="password" class="form-control rounded-3" name="confirm_password" placeholder="Confirm new password" required>
                    </div>

                    <div class="d-flex gap-2 justify-content-end">
                        <a href="{{ url_for('dashboard') }}" class="btn btn-light rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary rounded-pill px-4"><i class="fas fa-save me-1"></i> Save Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
